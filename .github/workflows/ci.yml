name: CI

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Unit tests run in a real browser via vitest-browser-svelte.
      - run: npx playwright install chromium --with-deps

      - run: npm run lint

      # Build first: the paraglide vite plugin generates src/lib/paraglide,
      # which is gitignored. check and test cannot resolve $lib/paraglide/*
      # until it exists.
      - run: npm run build

      - run: npm run check
      - run: npm run test

  deploy:
    name: Deploy to production
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - run: npm i -g @railway/cli

      # Railway builds the image from the Dockerfile.
      # Runtime env comes from Railway variables, not from this workflow.
      - run: railway up --service "$RAILWAY_SERVICE" --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: button-counter
